Packages:
  - Version: 1.1.0
    RequiredApiVersion: 6.0.0
    ReleaseDate: 2026-09-04
    PackageUrl: https://github.com/Whereis-Alice/SaveVault/releases/download/1.1.0/SaveVault_fd085db8-9b7c-4f83-a2df-3f0784eae1d0_1_1_0.pext
    Changelog:
      - New top panel button that opens the vault in one click and shows how much of the size budget is already spent, with a setting to hide it again
      - Games can be taken out of automatic backups with a checkbox per row in the manager, one row at a time or a whole filtered selection at once
      - New scope selector in the manager: games already in the vault, the whole library, or only the excluded ones, so a game can be skipped before it is ever scanned
      - Select all and select none next to the name filter
      - The manager footer now states how many games are excluded and how much space their old snapshots still take, with one button to delete exactly those snapshots after confirmation
      - The game menu entry flips between skipping and resuming automatic backups depending on what the selection currently is, and no longer claims to do the opposite of what it does
      - An excluded game is skipped by the post play backup, the scheduled backup, the library wide backup, runtime learning and the library wide detection, and both library summaries now report how many games were skipped instead of quietly dropping them from every count
      - An excluded game stays restorable and can still be backed up by hand from its own menu
  - Version: 1.0.1
    RequiredApiVersion: 6.0.0
    ReleaseDate: 2026-09-04
    PackageUrl: https://github.com/Whereis-Alice/SaveVault/releases/download/1.0.1/SaveVault_fd085db8-9b7c-4f83-a2df-3f0784eae1d0_1_0_1.pext
    Changelog:
      - Runtime learning now has to prove a folder belongs to the game: under the install folder or its UAC mirror, a path segment matching the title, or a path segment that literally means saves
      - A folder that only qualifies by sitting in the install directory must also have written a file that looks like a save, which keeps logs and shader caches out
      - The application blocklist, the vault root and Playnite config exclusions and the candidate size caps now apply to learned folders too
      - Learned locations recorded by 1.0.0 are re-checked once on startup and the bad ones are removed with a notification
      - New main menu entry to re-check learned locations, which also offers to delete the snapshots those locations produced and re-backs up the game afterwards
      - Nested duplicate locations of one game are collapsed to the outermost folder, so the inner files are no longer packed twice
      - New per snapshot limit, 512 MB and 20000 files by default and 0 to disable: an oversized location is skipped with an explicit notice instead of silently writing a multi gigabyte archive
      - A library wide backup now reports which games were skipped for being over that limit
      - Prune and re-check report how far the vault is over its budget and name the three largest games, because retention never deletes a game's only snapshot and cannot enforce the quota on its own
      - Fixed the Chinese over budget message, which had its two numbers the wrong way round
  - Version: 1.0.0
    RequiredApiVersion: 6.0.0
    ReleaseDate: 2026-09-01
    PackageUrl: https://github.com/Whereis-Alice/SaveVault/releases/download/1.0.0/SaveVault_fd085db8-9b7c-4f83-a2df-3f0784eae1d0_1_0_0.pext
    Changelog:
      - Initial release: versioned save-game snapshots for the whole Playnite library, with no external tool required
      - Six detection layers merged by trust: manual, learned while playing, Ludusavi manifest, install folder, user folders, registry guess
      - Runtime learning watches the game while it runs and records the folders it actually writes to, which is what finally covers doujin and Japanese visual novels
      - Loose save files in the install root are captured with a file filter, so the game itself is never packed into the archive
      - Word-boundary prefix matching plus a noise list and a size gate keep asset, build and cache folders out of the results
      - Snapshots are zip archives with a manifest, grouped per game, and only written when the save actually changed
      - Retention keeps the newest and all pinned snapshots, then one per day and one per week, under a global size quota
      - The global quota deletes the oldest unpinned snapshot first and never removes a game's only snapshot
      - Restore writes an undo snapshot first, so every restore can be rolled back
      - Optional registry backup through reg.exe, off by default, with an exported undo copy before every import
      - Details view panel showing save locations, recent snapshots and backup, detect and manage actions
      - Manager window with library-wide filtering, statistics and bulk detect, backup and prune
      - Backup triggers: after play, before launch, on a schedule, or manually
      - Publishes 16 theme resource keys so themes can restyle every surface
      - English and Simplified Chinese UI